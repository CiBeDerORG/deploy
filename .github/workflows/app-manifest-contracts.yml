name: Deploy App Manifest Contract Tests

on:
  push:
    paths:
      - "schema/**"
      - "tests/contracts/**"
      - ".github/workflows/app-manifest-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test-only dependencies
        run: python -m pip install "PyYAML>=6,<7" "jsonschema>=4.20,<5"
      - name: Verify JSON Schema, Portainer and Sub2API fixtures
        run: python -m unittest discover -s tests/contracts -p "test_*.py" -v
