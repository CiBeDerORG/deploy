name: Deploy App Manifest Contract Tests

on:
  push:
    paths:
      - "schema/**"
      - "tests/contracts/**"
      - "tools/validate_app_manifest.py"
      - "portainer/deploy/**"
      - "portainer/app.yaml"
      - "sub2api/deploy/**"
      - "sub2api/app.yaml"
      - "lib/image-sources.sh"
      - ".env.example"
      - ".secrets.example"
      - ".github/workflows/app-manifest-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test-only dependencies
        run: python -m pip install "PyYAML>=6,<7" "jsonschema>=4.20,<5"
      - name: Validate production manifests, JSON Schema and safe Compose packages
        run: |
          python -m compileall -q tools/validate_app_manifest.py tests/contracts
          python -m unittest discover -s tests/contracts -p "test_*.py" -v
          python tools/validate_app_manifest.py --examples --all
