name: Self-hosted Runner Check

on:
  push:
    paths:
      - ".github/workflows/self-hosted-runner-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-check:
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Show runner environment
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "HOSTNAME=$(hostname)"
          echo "USER=$(whoami)"
          uname -a
