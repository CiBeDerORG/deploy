name: macOS Deploy CLI Compatibility

on:
  push:
    branches:
      - feat/macos-deploy-entry-20261106
      - feat/macos-easyhostagent-phase1-20261106
      - feat/macos-docker-phase2-20261106
    paths:
      - deploy.sh
      - macos/**
      - easynettopo/deploy/docker-compose.macos.yaml
      - tests/macos-deploy.sh
      - tests/macos-agent-install.sh
      - tests/macos-app-market.sh
      - tests/contracts/test_manifest_v1.py
      - lib/**
      - mihomo/**
      - opencode/**
      - portainer/**
      - qoder2api-hub/**
      - sub2api/**
      - schema/**
      - docs/app-store-contract.md
      - .github/workflows/macos-deploy-check.yml
  pull_request:
    paths:
      - deploy.sh
      - macos/**
      - easynettopo/deploy/docker-compose.macos.yaml
      - tests/macos-deploy.sh
      - tests/macos-app-market.sh
      - tests/contracts/test_manifest_v1.py
      - lib/**
      - mihomo/**
      - opencode/**
      - portainer/**
      - qoder2api-hub/**
      - sub2api/**
      - schema/**
      - docs/app-store-contract.md
      - .github/workflows/macos-deploy-check.yml

permissions:
  contents: read

jobs:
  macos-cli:
    name: macOS Bash 3.2 deploy CLI and Docker stub lifecycle
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Run native macOS compatibility checks
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        run: /bin/bash tests/macos-deploy.sh
      - name: Run macOS app market lifecycle compatibility checks
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        run: /bin/bash tests/macos-app-market.sh

  macos-native-agent:
    name: macOS 原生 Agent 开发版、launchd 与 Docker 管理入口测试
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: 验证安装器实际下载、签名摘要、身份保留及服务生命周期
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
        run: /bin/bash tests/macos-agent-install.sh
