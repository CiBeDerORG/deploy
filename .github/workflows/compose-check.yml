name: Deployment Compose Check

on:
  push:
    paths:
      - "sub2api/**"
      - "qoder2api-hub/**"
      - "openhands/**"
      - ".env.example"
      - ".secrets.example"
      - "mihomo/**"
      - ".github/workflows/compose-check.yml"
  pull_request:
    paths:
      - "sub2api/**"
      - "qoder2api-hub/**"
      - "openhands/**"
      - ".env.example"
      - ".secrets.example"
      - "mihomo/**"
      - ".github/workflows/compose-check.yml"

permissions:
  contents: read

jobs:
  compose-config:
    runs-on: ubuntu-latest
    env:
      SUB2API_HTTP_PORT: "7010"
      SUB2API_BIND_IP: "0.0.0.0"
      SUB2API_POSTGRES_PASSWORD: "test-db-password"
      SUB2API_REDIS_PASSWORD: "test-redis-password"
      SUB2API_JWT_SECRET: "test-jwt-secret"
      SUB2API_TOTP_ENCRYPTION_KEY: "test-totp-secret"
      MIHOMO_MIXED_PORT: "7011"
      MIHOMO_API_PORT: "7012"
      MIHOMO_CORE_API_PORT: "7013"
      MIHOMO_PROXY_BIND_IP: "127.0.0.1"
      MIHOMO_API_BIND_IP: "0.0.0.0"
      MIHOMO_CORE_API_BIND_IP: "0.0.0.0"
      MIHOMO_API_SECRET: "test-api-secret"
      MIHOMO_CONTROL_TOKEN: "test-agent-token"
      DEPLOY_OPENHANDS_IMAGE: "ghcr.io/openhands/agent-canvas:latest"
      OPENHANDS_PORT: "7016"
      OPENHANDS_BIND_IP: "0.0.0.0"
      OPENHANDS_API_KEY: "test-openhands-key"
      QODER2API_HUB_PORT: "8790"
      QODER2API_HUB_BIND_IP: "127.0.0.1"
      QODER2API_HUB_API_KEY: "test-qoder-api-key"
      QODER2API_HUB_IMAGE: "ghcr.io/shuishuipingan/qoder2api-hub:latest"
      QODER2API_HUB_HTTP_PROXY: ""
      QODER2API_HUB_HTTPS_PROXY: ""
      QODER2API_HUB_ALL_PROXY: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare isolated proxy network
        run: docker network create --driver bridge --internal proxy-net

      - name: Validate Compose files
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f sub2api/deploy/docker-compose.yaml config --quiet
          docker compose -f qoder2api-hub/deploy/docker-compose.yaml config --quiet
          docker compose -f openhands/deploy/docker-compose.yaml config --quiet
          docker compose -f mihomo/deploy/docker-compose.yaml config --quiet
          docker compose -f sub2api/deploy/docker-compose.yaml config --format json > /tmp/sub2api-compose.json
          docker compose -f qoder2api-hub/deploy/docker-compose.yaml config --format json > /tmp/qoder2api-hub-compose.json
          docker compose -f openhands/deploy/docker-compose.yaml config --format json > /tmp/openhands-compose.json
          docker compose -f mihomo/deploy/docker-compose.yaml config --format json > /tmp/mihomo-compose.json

      - name: Assert safe default exposure and persistence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          s = json.loads(Path('/tmp/sub2api-compose.json').read_text())
          q = json.loads(Path('/tmp/qoder2api-hub-compose.json').read_text())
          o = json.loads(Path('/tmp/openhands-compose.json').read_text())
          m = json.loads(Path('/tmp/mihomo-compose.json').read_text())
          assert set(s['services']) == {'sub2api', 'postgres', 'redis'}
          assert not s['services']['postgres'].get('ports'), 'Postgres must not publish host ports'
          assert not s['services']['redis'].get('ports'), 'Redis must not publish host ports'
          assert s['services']['sub2api']['ports'][0]['published'] == '7010'
          assert s['services']['postgres']['environment']['PGDATA'] == '/var/lib/postgresql/data'
          for component in ('sub2api', 'postgres', 'redis'):
              assert s['services'][component]['volumes'], f'{component} must persist data'
          assert set(o['services']) == {'openhands'}
          oh = o['services']['openhands']
          assert oh['image'] == 'ghcr.io/openhands/agent-canvas:latest'
          assert oh['container_name'] == 'openhands'
          assert oh['ports'][0]['published'] == '7016' and oh['ports'][0]['target'] == 8000
          assert oh['environment']['LOCAL_BACKEND_API_KEY'] == 'test-openhands-key'
          assert oh['environment']['OH_SESSION_API_KEYS_0'] == oh['environment']['LOCAL_BACKEND_API_KEY'], 'Agent Server must require the same API key'
          assert oh['environment']['AGENT_CANVAS_ALLOW_LAN_SESSION_KEY'] == 'false'
          assert '/api/conversations/search' in ' '.join(oh['healthcheck']['test']), 'Healthcheck must reject unauthenticated Agent API'
          assert {v['target'] for v in oh['volumes']} == {'/home/openhands/.openhands', '/projects'}
          assert not oh.get('privileged') and oh.get('network_mode') != 'host'
          assert not any(v['target'] == '/var/run/docker.sock' for v in oh['volumes'])
          assert oh['healthcheck']
          assert set(q['services']) == {'qoder2api-hub'}
          qoder = q['services']['qoder2api-hub']
          assert qoder['image'] == 'ghcr.io/shuishuipingan/qoder2api-hub:latest'
          assert qoder['container_name'] == 'qoder2api-hub'
          assert qoder['ports'][0]['host_ip'] == '127.0.0.1'
          assert qoder['ports'][0]['published'] == '8790' and qoder['ports'][0]['target'] == 8790
          assert qoder['environment']['HOST'] == '0.0.0.0' and qoder['environment']['PORT'] == '8790'
          assert qoder['environment']['API_KEY'] == 'test-qoder-api-key'
          assert len(qoder['volumes']) == 2
          assert {v['target'] for v in qoder['volumes']} == {'/app/accounts', '/app/usage'}
          assert qoder['healthcheck'] and '/ping' in ' '.join(qoder['healthcheck']['test'])
          assert qoder['restart'] == 'unless-stopped'
          assert set(m['services']) == {'mihomo'}
          mihomo = m['services']['mihomo']
          assert not mihomo.get('privileged') and mihomo.get('network_mode') != 'host'
          ports = {p['published']: p for p in mihomo['ports']}
          assert set(ports) == {'7011', '7012', '7013'}, ports
          assert ports['7011']['host_ip'] == '127.0.0.1' and ports['7011']['target'] == 7890, ports
          assert ports['7012']['host_ip'] == '0.0.0.0' and ports['7012']['target'] == 8080, ports
          assert ports['7013']['host_ip'] == '0.0.0.0' and ports['7013']['target'] == 9090, ports
          template = Path('.env.example').read_text()
          assert 'MIHOMO_PROXY_BIND_IP=127.0.0.1' in template
          assert 'MIHOMO_API_BIND_IP=0.0.0.0' in template
          config = Path('mihomo/deploy/default-profile.yaml').read_text()
          assert 'tun:' in config and 'enable: false' in config
          assert 'external-ui-url' not in config
          assert mihomo['image'] == 'ghcr.io/metacubex/metacubexd-server:latest'
          assert mihomo['environment']['CLASH_SECRET'] == 'test-api-secret'
          assert mihomo['environment']['CONTROL_TOKEN'] == 'test-agent-token'
          assert mihomo['environment']['CONTROL_PORT'] == '8080'
          assert mihomo['environment']['CLASH_API_PORT'] == '9090'
          assert mihomo['environment']['MIXED_PORT'] == '7890'
          assert mihomo['environment']['DATA_DIR'] == '/data'
          assert any(v['target'] == '/data' for v in mihomo['volumes']), 'Agent data must persist'
          assert mihomo['healthcheck'], 'Web/Agent healthcheck required'
          install = Path('mihomo/deploy/install.sh').read_text()
          assert 'legacy_profile_copy' in Path('mihomo/deploy/migrate.sh').read_text()
          assert 'docker exec mihomo node -e' in install
          assert 'authentication_stanza' in Path('mihomo/deploy/migrate.sh').read_text()
          assert 'deploy-proxy-auth' in Path('mihomo/deploy/migrate.sh').read_text()
          assert 'docker compose' in install
          assert 'MIHOMO_CONTROL_TOKEN=' in Path('.secrets.example').read_text()
          assert 'MIHOMO_CORE_API_PORT=7013' in template
          for source in ('.env.example', 'mihomo/deploy/common.sh', 'mihomo/deploy/migrate.sh', 'mihomo/deploy/install.sh', 'mihomo/README.md'):
              assert 'MIHOMO_WEB_ORIGIN' not in Path(source).read_text(), source
          assert set(mihomo['networks']) == {'default', 'proxy-net'}
          assert m['networks']['proxy-net']['external'] is True
          assert m['networks']['proxy-net']['name'] == 'proxy-net'
          PY

      - name: Verify dynamic network connect and disconnect
        shell: bash
        run: |
          set -euo pipefail
          sudo bash mihomo/deploy/proxy-network.sh ensure
          docker run -d --name mihomo --network proxy-net busybox:1.36 sleep 180
          docker run -d --name proxy-cli-target busybox:1.36 sleep 180
          trap 'docker rm -f proxy-cli-target mihomo >/dev/null 2>&1 || true' EXIT
          sudo bash mihomo/deploy/proxy-network.sh status proxy-cli-target | grep '未接入'
          sudo bash mihomo/deploy/proxy-network.sh connect proxy-cli-target
          sudo bash mihomo/deploy/proxy-network.sh connect proxy-cli-target
          docker network inspect -f '{{range .Containers}}{{println .Name}}{{end}}' proxy-net | grep -Fx proxy-cli-target
          sudo bash mihomo/deploy/proxy-network.sh status proxy-cli-target | grep '已接入'
          if sudo bash mihomo/deploy/proxy-network.sh disconnect mihomo; then
            echo 'must not disconnect mihomo itself' >&2; exit 1
          fi
          sudo bash mihomo/deploy/proxy-network.sh disconnect proxy-cli-target
          sudo bash mihomo/deploy/proxy-network.sh disconnect proxy-cli-target
          if docker network inspect -f '{{range .Containers}}{{println .Name}}{{end}}' proxy-net | grep -Fx proxy-cli-target; then
            echo 'target must be disconnected' >&2; exit 1
          fi
