name: Shell Check

on:
  push:
    paths:
      - "**/*.sh"
      - "lib/versions.env"
      - "tests/software-root-default.sh"
      - "mihomo/**/*.mjs"
      - ".github/workflows/shell-check.yml"
  pull_request:
    paths:
      - "**/*.sh"
      - "lib/versions.env"
      - "tests/software-root-default.sh"
      - "mihomo/**/*.mjs"
      - ".github/workflows/shell-check.yml"

permissions:
  contents: read

jobs:
  shell-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Verify tracked version registry contract
        run: bash tests/versions.sh

      - name: Verify default software root and legacy path compatibility
        run: bash tests/software-root-default.sh

      - name: Set up native adapter test runtime
        uses: actions/setup-node@v6
        with:
          node-version: "22.23.4"
          package-manager-cache: false

      - name: Install locked YAML regression dependency
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/mihomo-yaml" --no-package-lock --ignore-scripts --no-audit --no-fund yaml@2.9.0
          echo "MIHOMO_TEST_YAML_DIR=$RUNNER_TEMP/mihomo-yaml/node_modules/yaml" >> "$GITHUB_ENV"

      - name: Bash syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "bash -n $file"
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -print0)

      - name: ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f -name '*.sh' -print0)
          shellcheck --severity=error "${files[@]}"

      - name: Verify no legacy Mihomo deployment source remains
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            mihomo/deploy/lib.sh \
            mihomo/deploy/config.example.yaml \
            mihomo/deploy/profile.example.yaml \
            mihomo/tests/password-config.sh \
            mihomo/tests/all-in-one.sh; do
            test ! -e "$path" || { echo "Legacy source remains: $path" >&2; exit 1; }
          done
          grep -F 'run_root rm -f -- "$target_dir/$obsolete"' deploy.sh

      - name: Mihomo clean installer credential regression
        shell: bash
        run: bash mihomo/tests/credentials.sh

      - name: Mihomo initial data and migration regression
        shell: bash
        run: bash mihomo/tests/migration.sh

      - name: Mihomo native host listener isolation regression
        shell: bash
        run: bash mihomo/tests/host.sh

      - name: Mihomo native installer and rollback regression
        shell: bash
        run: bash mihomo/tests/host-install.sh

      - name: 核验 EasyNetTopo 凭据、重试与镜像轮换
        run: sudo bash easynettopo/tests/deployment.sh

      - name: 验证 GitHub Release 下载加速轮换
        run: bash tests/github-release-sources.sh

      - name: 核验 EasyHostAgent 原生安装、HTTP 和卸载
        run: sudo bash easyhostagent/tests/deployment.sh

      - name: Sub2API upstream admin password policy regression
        shell: bash
        run: bash sub2api/tests/password-policy.sh

      - name: Sub2API optional secret blank and persistence regression
        shell: bash
        run: bash sub2api/tests/optional-inputs.sh

      - name: Qoder2API Hub install, data persistence and GHCR mirror regression
        shell: bash
        run: bash qoder2api-hub/tests/install.sh

      - name: OpenHands optional secret and credential regression
        shell: bash
        run: sudo bash openhands/tests/config.sh
