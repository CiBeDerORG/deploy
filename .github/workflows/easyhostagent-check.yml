name: EasyHostAgent 原生部署检查

on:
  push:
    paths:
      - "easyhostagent/**"
      - "lib/release-sources.sh"
      - "tests/github-release-sources.sh"
      - ".env.example"
      - "deploy.sh"
      - ".github/workflows/easyhostagent-check.yml"
  pull_request:
    paths:
      - "easyhostagent/**"
      - ".env.example"
      - "deploy.sh"
      - ".github/workflows/easyhostagent-check.yml"

permissions:
  contents: read

jobs:
  native-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: 语法和静态检查
        run: |
          set -euo pipefail
          while IFS= read -r -d '' path; do
            bash -n "$path"
          done < <(find easyhostagent -type f -name '*.sh' -print0)
          shellcheck --severity=error easyhostagent/deploy/*.sh easyhostagent/tests/*.sh
      - name: 验证 Release 下载加速站轮换与校验回退
        run: bash tests/github-release-sources.sh
      - name: 按应用授权、去重及回滚测试
        run: sudo bash easyhostagent/tests/grant.sh
      - name: 原生安装、更新、卸载和 HTTP 配置
        run: sudo bash easyhostagent/tests/deployment.sh
