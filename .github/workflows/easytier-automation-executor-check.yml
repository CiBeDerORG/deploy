name: EasyTier Executor Deploy Check

on:
  push:
    branches: [main]
    paths:
      - "easytier-automation-executor/**"
      - "tests/easytier-automation-executor-install.sh"
      - ".env.example"
      - "lib/versions.env"
      - "lib/versions.sh"
      - ".secrets.example"
      - "README.md"
      - ".github/workflows/easytier-automation-executor-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify script syntax, discovery and global configuration
        shell: bash
        run: |
          set -euo pipefail
          bash -n easytier-automation-executor/deploy/install.sh
          bash -n easytier-automation-executor/deploy/update.sh
          bash -n deploy.sh
          bash -n tests/easytier-automation-executor-install.sh
          bash tests/easytier-automation-executor-install.sh
          grep -Fq "{{ index .Config.Labels \"com.docker.compose.project\" }}" easytier-automation-executor/deploy/install.sh
          grep -Fq '{{.Architecture}}' easytier-automation-executor/deploy/install.sh
          grep -Fq '{{.State.Status}}' easytier-automation-executor/deploy/install.sh
          test "$(bash deploy.sh list | grep -c 'easytier-automation-executor')" -eq 1
          grep -q '^EASYTIER_EXECUTOR_CALLBACK_URL=' .env.example
          grep -q '^EASYTIER_EXECUTOR_IMAGE=' lib/versions.env
          if grep -q '^EASYTIER_EXECUTOR_IMAGE=' .env.example; then
            echo 'Executor image version must be in lib/versions.env only' >&2
            exit 1
          fi
          grep -q '^EASYTIER_EXECUTOR_TOKEN=' .secrets.example
          if grep -q '^EASYTIER_EXECUTOR_TOKEN=' .env.example; then
            echo 'Executor token must not be stored in the public configuration template' >&2
            exit 1
          fi
      - name: Validate isolated host-network Compose service without printing credentials
        shell: bash
        env:
          EASYTIER_EXECUTOR_TOKEN: ci-only-credential-01234567890123456789
          EASYTIER_EXECUTOR_CALLBACK_URL: http://127.0.0.1:7007
          EASYTIER_EXECUTOR_BIND_IP: 127.0.0.1
          EASYTIER_EXECUTOR_PORT: '8766'
        run: |
          set -euo pipefail
          file=easytier-automation-executor/deploy/docker-compose.yaml
          export DEPLOY_EASYTIER_EXECUTOR_IMAGE="$(sed -n 's/^EASYTIER_EXECUTOR_IMAGE=//p' lib/versions.env)"
          test -n "$DEPLOY_EASYTIER_EXECUTOR_IMAGE"
          docker compose -f "$file" config --quiet
          docker compose -f "$file" config --format json | python3 -c '
          import json, sys, os
          model = json.load(sys.stdin)
          assert list(model["services"]) == ["easytier-automation-executor"]
          service = model["services"]["easytier-automation-executor"]
          assert service["network_mode"] == "host"
          assert service["container_name"] == "easytier-automation-executor"
          assert "--workers" in service["command"] and service["command"][service["command"].index("--workers")+1] == "1"
          assert len(service["volumes"]) == 2
          targets = {entry["target"] for entry in service["volumes"]}
          assert targets == {"/var/lib/easytier-automation", "/home/automation/.android"}
          assert service["environment"]["AUTOMATION_CALLBACK_URL"] == "http://127.0.0.1:7007"
          assert service["image"] == os.environ["DEPLOY_EASYTIER_EXECUTOR_IMAGE"]
          print("Independent executor Compose structure verified without emitting secrets")
          '
