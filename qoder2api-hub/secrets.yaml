fields:
- key: QODER2API_HUB_API_KEY
  label: 首次启动 API 密钥（可选）
  description: 留空时由上游镜像在首次启动时自动生成并持久化 API 密钥。
  type: secret
  required: false
  default: ''
  custom_input: true
  editable: true
- key: QODER2API_HUB_HTTP_PROXY
  label: HTTP 代理地址（可选）
  type: secret
  required: false
  default: ''
  description: 用于访问外部服务的 HTTP 代理 URL，可留空
  custom_input: true
  editable: true
- key: QODER2API_HUB_HTTPS_PROXY
  label: HTTPS 代理地址（可选）
  type: secret
  required: false
  default: ''
  description: 用于访问外部服务的 HTTPS 代理 URL，可留空
  custom_input: true
  editable: true
- key: QODER2API_HUB_ALL_PROXY
  label: 全协议代理地址（可选）
  type: secret
  required: false
  default: ''
  description: 用于全部支持协议的代理 URL，可留空
  custom_input: true
  editable: true
