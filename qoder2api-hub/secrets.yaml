fields:
- key: QODER2API_HUB_API_KEY
  label: Optional startup API key
  description: Leave blank to let the upstream image generate and persist an API key
    on first startup.
  type: secret
  required: false
  default: ''
  custom_input: true
  editable: true
- key: QODER2API_HUB_HTTP_PROXY
  label: Optional HTTP proxy URL
  type: secret
  required: false
  default: ''
  description: Optional HTTP proxy URL
  custom_input: true
  editable: true
- key: QODER2API_HUB_HTTPS_PROXY
  label: Optional HTTPS proxy URL
  type: secret
  required: false
  default: ''
  description: Optional HTTPS proxy URL
  custom_input: true
  editable: true
- key: QODER2API_HUB_ALL_PROXY
  label: Optional all-protocol proxy URL
  type: secret
  required: false
  default: ''
  description: Optional all-protocol proxy URL
  custom_input: true
  editable: true
