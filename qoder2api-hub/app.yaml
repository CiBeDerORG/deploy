schema_version: 2
id: qoder2api-hub
name: Qoder2API Hub
summary: 支持多账号管理的 Qoder API 网关，兼容 OpenAI 与 Anthropic 接口
enabled: false
category: developer
homepage: https://github.com/shuishuipingan/qoder2api-hub
runtime:
  kind: docker_compose
  compose_project: qoder2api-hub
  compose_file: deploy/docker-compose.yaml
  requires_root: true
compatibility:
  platforms:
  - linux
  - fnos
  - macos
  architectures:
  - amd64
  - arm64
  requires_docker: true
  requires_compose_v2: true
package:
  files:
  - source: qoder2api-hub/deploy/docker-compose.yaml
    destination: qoder2api-hub/deploy/docker-compose.yaml
  - source: qoder2api-hub/deploy/install.sh
    destination: qoder2api-hub/deploy/install.sh
    mode: '0755'
  - source: qoder2api-hub/deploy/update.sh
    destination: qoder2api-hub/deploy/update.sh
    mode: '0755'
  - source: qoder2api-hub/deploy/uninstall.sh
    destination: qoder2api-hub/deploy/uninstall.sh
    mode: '0755'
  - source: qoder2api-hub/deploy/lib.sh
    destination: qoder2api-hub/deploy/lib.sh
  - source: versions.env
    destination: deploy/versions.env
    mode: '0644'
  - source: lib/versions.sh
    destination: deploy/lib/versions.sh
    mode: '0644'
  - source: lib/image-sources.sh
    destination: deploy/lib/image-sources.sh
  - source: lib/platform.sh
    destination: deploy/lib/platform.sh
  - source: qoder2api-hub/config.yaml
    destination: qoder2api-hub/config.yaml
    mode: '0644'
  - source: qoder2api-hub/secrets.yaml
    destination: qoder2api-hub/secrets.yaml
    mode: '0644'
  - source: qoder2api-hub/deploy/config.env.example
    destination: qoder2api-hub/deploy/config.env.example
    mode: '0644'
  - source: qoder2api-hub/deploy/config.secrets.example
    destination: qoder2api-hub/deploy/config.secrets.example
    mode: '0644'
  - source: lib/app-config.sh
    destination: deploy/lib/app-config.sh
    mode: '0644'
ports:
- id: web-api
  label: Web 管理面板与 API 服务
  protocol: tcp
  purpose: web
  host_port_key: QODER2API_HUB_PORT
  bind_address_key: QODER2API_HUB_BIND_IP
  container_port: 8790
  service: qoder2api-hub
  path: /
actions:
  install:
    strategy: script
    path: deploy/install.sh
  update:
    strategy: script
    path: deploy/update.sh
  uninstall:
    strategy: script
    path: deploy/uninstall.sh
verification:
  mode: docker_compose
  required_services:
  - qoder2api-hub
  state: healthy
  timeout_seconds: 180
data:
  paths:
  - qoder2api-hub/data/accounts
  - qoder2api-hub/data/usage
  named_volumes: []
  default_retain: true
configuration:
  config: config.yaml
  secrets: secrets.yaml
icon: assets/icon.svg
