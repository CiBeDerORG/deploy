schema_version: 2
id: portainer
name: Portainer
summary: 用于管理 Docker 容器、镜像和 Compose 项目的 Web 控制台
category: infrastructure
homepage: https://www.portainer.io/
runtime:
  kind: docker_compose
  compose_project: portainer
  compose_file: deploy/docker-compose.yaml
  requires_root: true
compatibility:
  platforms:
  - linux
  - fnos
  - macos
  architectures:
  - amd64
  - arm64
  requires_docker: true
  requires_compose_v2: true
package:
  files:
  - source: portainer/deploy/docker-compose.yaml
    destination: portainer/deploy/docker-compose.yaml
  - source: portainer/deploy/install.sh
    destination: portainer/deploy/install.sh
    mode: '0755'
  - source: portainer/deploy/update.sh
    destination: portainer/deploy/update.sh
    mode: '0755'
  - source: portainer/deploy/uninstall.sh
    destination: portainer/deploy/uninstall.sh
    mode: '0755'
  - source: lib/image-sources.sh
    destination: deploy/lib/image-sources.sh
  - source: lib/platform.sh
    destination: deploy/lib/platform.sh
  - source: portainer/config.yaml
    destination: portainer/config.yaml
    mode: '0644'
  - source: portainer/secrets.yaml
    destination: portainer/secrets.yaml
    mode: '0644'
  - source: portainer/deploy/config.env.example
    destination: portainer/deploy/config.env.example
    mode: '0644'
  - source: portainer/deploy/config.secrets.example
    destination: portainer/deploy/config.secrets.example
    mode: '0644'
  - source: lib/app-config.sh
    destination: deploy/lib/app-config.sh
    mode: '0644'
ports:
- id: web
  label: Web 管理界面
  protocol: tcp
  purpose: web
  host_port_key: PORTAINER_HTTP_PORT
  container_port: 9000
  service: portainer
  path: /
actions:
  install:
    strategy: script
    path: deploy/install.sh
  update:
    strategy: script
    path: deploy/update.sh
  uninstall:
    strategy: script
    path: deploy/uninstall.sh
verification:
  mode: docker_compose
  required_services:
  - portainer
  state: running
  timeout_seconds: 180
data:
  paths:
  - portainer/data
  named_volumes: []
  default_retain: true
configuration:
  config: config.yaml
  secrets: secrets.yaml
icon: assets/icon.svg
