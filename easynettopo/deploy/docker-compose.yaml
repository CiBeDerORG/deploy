name: easynettopo

services:
  easynettopo:
    image: "${DEPLOY_EASYNETTOPO_IMAGE:-ghcr.io/cibederorg/easynettopo:feat-docker-app-store}"
    container_name: easynettopo
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      HOME: /home/easynettopo
      EASYNETTOPO_LISTEN_ADDRESS: 0.0.0.0:8080
      # 仅在容器内开放 IPv4 监听，宿主机入口仍限制到回环地址。
      EASYNETTOPO_ALLOW_CONTAINER_BIND: "true"
      EASYNETTOPO_DATABASE_PATH: /data/app.db
      EASYNETTOPO_WEB_DIR: /opt/easynettopo/web
      EASYNETTOPO_GIT_ALLOWED_HOSTS: "${EASYNETTOPO_GIT_ALLOWED_HOSTS:-github.com}"
      EASYNETTOPO_GIT_ALLOW_HTTP: "${EASYNETTOPO_GIT_ALLOW_HTTP:-false}"
    ports:
      # 宿主机监听地址由统一 .env 控制：0.0.0.0 为所有 IPv4 网卡，127.0.0.1 仅本机。
      - "${EASYNETTOPO_BIND_IP:-0.0.0.0}:${EASYNETTOPO_HTTP_PORT:-7017}:8080"
    volumes:
      - ../data:/data
      - ../ssh:/home/easynettopo/.ssh:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

