name: easynettopo

services:
  easynettopo:
    image: "${DEPLOY_EASYNETTOPO_IMAGE:-ghcr.io/cibederorg/easynettopo:feat-docker-app-store}"
    container_name: easynettopo
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      HOME: /home/easynettopo
      EASYNETTOPO_LISTEN_ADDRESS: 127.0.0.1:8080
      EASYNETTOPO_DATABASE_PATH: /data/app.db
      EASYNETTOPO_WEB_DIR: /opt/easynettopo/web
      EASYNETTOPO_GIT_ALLOWED_HOSTS: "${EASYNETTOPO_GIT_ALLOWED_HOSTS:-github.com}"
      EASYNETTOPO_GIT_ALLOW_HTTP: "${EASYNETTOPO_GIT_ALLOW_HTTP:-false}"
    ports:
      # 原生 Go 只允许 127.0.0.1；由共用网络命名空间的代理转发到宿主机回环。
      # 默认禁止公网/局域网明文登录，外部访问需要另配 HTTPS 反向代理。
      - "127.0.0.1:${EASYNETTOPO_HTTP_PORT:-7017}:8081"
    volumes:
      - ../data:/data
      - ../ssh:/home/easynettopo/.ssh:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  gateway:
    image: "${DEPLOY_EASYNETTOPO_GATEWAY_IMAGE:-caddy:2.10-alpine}"
    container_name: easynettopo-gateway
    network_mode: "service:easynettopo"
    depends_on:
      easynettopo:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    # 官方 Caddy 二进制带 cap_net_bind_service 文件能力；完全移除 capability 会导致 exec EPERM。
    # 只恢复启动该二进制所需的 NET_BIND_SERVICE，不扩大其他权限。
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - /config:rw,nosuid,size=4m
      - /data:rw,nosuid,size=4m
      - /tmp:rw,noexec,nosuid,size=4m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/api/v1/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
