fields:
- key: EASYNETTOPO_ADMIN_USERNAME
  label: 首次初始化管理员账号
  type: secret
  required: false
  default: ''
  description: 账号只从统一 .secrets 读取；留空时使用 admin
  custom_input: false
  editable: false
- key: EASYNETTOPO_ADMIN_PASSWORD
  label: 首次初始化管理员密码
  type: secret
  required: false
  default: ''
  description: 已有管理员不重置；首次初始化留空时由现有安装脚本生成并持久化
  custom_input: false
  editable: false
