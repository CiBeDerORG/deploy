name: opencode
services:
  opencode:
    build:
      context: .
      dockerfile: Dockerfile

      extra_hosts:
        - "host.docker.internal:host-gateway"

      args:
        OPENCODE_BASE_IMAGE: "${DEPLOY_OPENCODE_BASE_IMAGE:-mcr.microsoft.com/devcontainers/typescript-node:24}"
        OPENCODE_CACHE_BUST: "${OPENCODE_CACHE_BUST:-manual}"

        # 仅在 build 阶段存在，不传入运行时 environment。
        HTTP_PROXY: "${BUILD_HTTP_PROXY:-}"
        HTTPS_PROXY: "${BUILD_HTTPS_PROXY:-}"
        NO_PROXY: "${BUILD_NO_PROXY:-127.0.0.1,localhost}"

    image: "opencode-local:latest"

    container_name: opencode
    restart: unless-stopped
    init: true

    working_dir: /workspace

    command:
      - "serve"
      - "--hostname"
      - "0.0.0.0"
      - "--port"
      - "4096"

    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      OPENCODE_PORT: "4096"
      MYAI_IP: "${MYAI_IP:?请在 <SOFTWARE_ROOT>/opencode/config/.env 中设置 MYAI_IP}"
      # OpenCode V2 serve 当前 Basic Auth 用户名固定为 opencode。
      OPENCODE_SERVER_PASSWORD: "${OPENCODE_SERVER_PASSWORD:?请在 <SOFTWARE_ROOT>/opencode/config/.secrets 中设置 OPENCODE_SERVER_PASSWORD}"

    ports:
      - "${OPENCODE_PORT:?请在 <SOFTWARE_ROOT>/opencode/config/.env 中设置 OPENCODE_PORT}:4096"

    volumes:
      - ../config:/root/.config/opencode
      - ../data:/root/.local/share/opencode
      - ../state:/root/.local/state/opencode
      - ../workspace:/workspace

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS --max-time 5 -u \"opencode:${OPENCODE_SERVER_PASSWORD}\" http://127.0.0.1:4096/api/health >/dev/null"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
