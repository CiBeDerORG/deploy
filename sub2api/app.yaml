schema_version: 2
id: sub2api
name: Sub2API
summary: 集成 PostgreSQL 和 Redis 的 API 服务与管理系统
category: developer
runtime:
  kind: docker_compose
  compose_project: sub2api
  compose_file: deploy/docker-compose.yaml
  requires_root: true
compatibility:
  platforms:
  - linux
  - fnos
  - macos
  architectures:
  - amd64
  - arm64
  requires_docker: true
  requires_compose_v2: true
package:
  files:
  - source: sub2api/deploy/docker-compose.yaml
    destination: sub2api/deploy/docker-compose.yaml
  - source: sub2api/deploy/install.sh
    destination: sub2api/deploy/install.sh
    mode: '0755'
  - source: sub2api/deploy/update.sh
    destination: sub2api/deploy/update.sh
    mode: '0755'
  - source: sub2api/deploy/uninstall.sh
    destination: sub2api/deploy/uninstall.sh
    mode: '0755'
  - source: sub2api/deploy/lib.sh
    destination: sub2api/deploy/lib.sh
  - source: lib/versions.env
    destination: deploy/lib/versions.env
    mode: '0644'
  - source: lib/versions.sh
    destination: deploy/lib/versions.sh
    mode: '0644'
  - source: lib/image-sources.sh
    destination: deploy/lib/image-sources.sh
  - source: lib/platform.sh
    destination: deploy/lib/platform.sh
  - source: sub2api/config.yaml
    destination: sub2api/config.yaml
    mode: '0644'
  - source: sub2api/secrets.yaml
    destination: sub2api/secrets.yaml
    mode: '0644'
  - source: sub2api/deploy/config.env.example
    destination: sub2api/deploy/config.env.example
    mode: '0644'
  - source: sub2api/deploy/config.secrets.example
    destination: sub2api/deploy/config.secrets.example
    mode: '0644'
  - source: lib/app-config.sh
    destination: deploy/lib/app-config.sh
    mode: '0644'
ports:
- id: web
  label: Web API 服务
  protocol: tcp
  purpose: web
  host_port_key: SUB2API_HTTP_PORT
  bind_address_key: SUB2API_BIND_IP
  container_port: 8080
  service: sub2api
  path: /
actions:
  install:
    strategy: script
    path: deploy/install.sh
  update:
    strategy: script
    path: deploy/update.sh
  uninstall:
    strategy: script
    path: deploy/uninstall.sh
verification:
  mode: docker_compose
  required_services:
  - sub2api
  - postgres
  - redis
  state: healthy
  timeout_seconds: 240
data:
  paths:
  - sub2api/data/app
  - sub2api/data/postgres
  - sub2api/data/redis
  named_volumes: []
  default_retain: true
configuration:
  config: config.yaml
  secrets: secrets.yaml
icon: assets/icon.svg
