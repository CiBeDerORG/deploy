fields:
- key: SUB2API_HTTP_PORT
  label: Web 访问端口
  type: port
  required: true
  default: 7010
  minimum: 1
  maximum: 65535
  description: Sub2API Web 与 API 服务对外开放的宿主机端口
  custom_input: true
  editable: true
- key: SUB2API_BIND_IP
  label: 服务监听地址
  type: ipv4
  required: true
  default: 0.0.0.0
  description: Sub2API 服务绑定的宿主机 IPv4 地址（0.0.0.0 表示所有 IPv4 网卡）
  custom_input: true
  editable: true
