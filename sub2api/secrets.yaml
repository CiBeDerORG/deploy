fields:
- key: SUB2API_ADMIN_EMAIL
  label: 初始管理员邮箱
  type: secret
  required: false
  default: ''
  description: 首次初始化管理员账号时使用的邮箱，可留空
  custom_input: true
  editable: true
- key: SUB2API_POSTGRES_PASSWORD
  label: PostgreSQL 数据库密码
  type: secret
  required: false
  default: ''
  generated_by_script: true
  description: PostgreSQL 数据库连接密码，留空由脚本安全生成
  custom_input: false
  editable: true
- key: SUB2API_REDIS_PASSWORD
  label: Redis 访问密码
  type: secret
  required: false
  default: ''
  generated_by_script: true
  description: Redis 连接密码，留空由脚本安全生成
  custom_input: false
  editable: true
- key: SUB2API_JWT_SECRET
  label: JWT 签名密钥
  type: secret
  required: false
  default: ''
  generated_by_script: true
  description: 用于签发和校验 JWT 的密钥，留空由脚本安全生成
  custom_input: false
  editable: true
- key: SUB2API_TOTP_ENCRYPTION_KEY
  label: TOTP 加密密钥
  type: secret
  required: false
  default: ''
  generated_by_script: true
  description: 用于保护 TOTP 凭据的加密密钥，留空由脚本安全生成
  custom_input: false
  editable: true
- key: SUB2API_ADMIN_PASSWORD
  label: 初始管理员密码
  type: secret
  required: false
  default: ''
  min_length: 8
  max_length: 72
  description: 首次初始化的管理员登录密码，可留空，非空值需符合上游长度要求
  custom_input: true
  editable: true
- key: SUB2API_UPDATE_PROXY_URL
  label: 更新下载代理地址（可带认证）
  type: secret
  required: false
  default: ''
  description: 下载更新资源时使用的代理 URL，可包含代理认证信息
  custom_input: true
  editable: true
