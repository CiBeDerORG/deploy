# Production catalog manifest v1. Validated against the checked-in Deploy scripts.
schema_version: 1
id: qoder2api-hub
name: Qoder2API Hub
summary: 支持多账号管理的 Qoder API 网关，兼容 OpenAI 与 Anthropic 接口
category: developer
homepage: https://github.com/shuishuipingan/qoder2api-hub
runtime:
  kind: docker_compose
  compose_project: qoder2api-hub
  compose_file: deploy/docker-compose.yaml
  requires_root: true
compatibility:
  platforms: [linux, fnos]
  architectures: [amd64, arm64]
  requires_docker: true
  requires_compose_v2: true
package:
  files:
    - source: qoder2api-hub/deploy/docker-compose.yaml
      destination: qoder2api-hub/deploy/docker-compose.yaml
    - source: qoder2api-hub/deploy/install.sh
      destination: qoder2api-hub/deploy/install.sh
      mode: "0755"
    - source: qoder2api-hub/deploy/update.sh
      destination: qoder2api-hub/deploy/update.sh
      mode: "0755"
    - source: qoder2api-hub/deploy/uninstall.sh
      destination: qoder2api-hub/deploy/uninstall.sh
      mode: "0755"
    - source: qoder2api-hub/deploy/lib.sh
      destination: qoder2api-hub/deploy/lib.sh
    - source: lib/image-sources.sh
      destination: deploy/lib/image-sources.sh
config:
  - key: QODER2API_HUB_BIND_IP
    label: Bind address
    type: ipv4
    target: env
    required: true
    default: 127.0.0.1
  - key: QODER2API_HUB_PORT
    label: Web/API port
    type: port
    target: env
    required: true
    default: 8790
    minimum: 1
    maximum: 65535
  - key: QODER2API_HUB_API_KEY
    label: Optional startup API key
    description: Leave blank to let the upstream image generate and persist an API key on first startup.
    type: secret
    target: secrets
    required: false
    default: ""
  - key: QODER2API_HUB_HTTP_PROXY
    label: Optional HTTP proxy URL
    type: secret
    target: secrets
    required: false
    default: ""
  - key: QODER2API_HUB_HTTPS_PROXY
    label: Optional HTTPS proxy URL
    type: secret
    target: secrets
    required: false
    default: ""
  - key: QODER2API_HUB_ALL_PROXY
    label: Optional all-protocol proxy URL
    type: secret
    target: secrets
    required: false
    default: ""
ports:
  - id: web-api
    label: Web 管理面板与 API 服务
    protocol: tcp
    purpose: web
    host_port_key: QODER2API_HUB_PORT
    bind_address_key: QODER2API_HUB_BIND_IP
    container_port: 8790
    service: qoder2api-hub
    path: /
actions:
  install:
    strategy: script
    path: deploy/install.sh
  update:
    strategy: script
    path: deploy/update.sh
  uninstall:
    strategy: script
    path: deploy/uninstall.sh
verification:
  mode: docker_compose
  required_services: [qoder2api-hub]
  state: healthy
  timeout_seconds: 180
data:
  paths:
    - qoder2api-hub/data/accounts
    - qoder2api-hub/data/usage
  named_volumes: []
  default_retain: true
