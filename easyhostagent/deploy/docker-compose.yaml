name: easyhostagent

services:
  easyhostagent:
    image: "${DEPLOY_EASYHOSTAGENT_IMAGE:-ghcr.io/cibederorg/easyhostagent:feat-docker-app-store}"
    container_name: easyhostagent
    restart: unless-stopped
    init: true
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      HOME: /tmp
      EASYHOSTAGENT_TRANSPORT: "${EASYHOSTAGENT_TRANSPORT:-https}"
      # 容器内始终监听可被 Docker 端口映射访问的 IPv4 地址。
      EASYHOSTAGENT_LISTEN_ADDRESS: "0.0.0.0:${DEPLOY_EASYHOSTAGENT_PORT:-7018}"
      EASYHOSTAGENT_PLATFORM: "${DEPLOY_EASYHOSTAGENT_PLATFORM:-linux}"
      EASYHOSTAGENT_DATA_DIR: "${DEPLOY_EASYHOSTAGENT_DATA_DIR:-/var/lib/easyhostagent}"
      EASYHOSTAGENT_SOFTWARE_ROOT: "${DEPLOY_EASYHOSTAGENT_SOFTWARE_ROOT:-/software}"
      EASYHOSTAGENT_LOG_LEVEL: "${EASYHOSTAGENT_LOG_LEVEL:-info}"
      EASYHOSTAGENT_APP_GRANTS: "${EASYHOSTAGENT_APP_GRANTS:-}"
    ports:
      - "${DEPLOY_EASYHOSTAGENT_BIND_IP:-0.0.0.0}:${DEPLOY_EASYHOSTAGENT_PORT:-7018}:${DEPLOY_EASYHOSTAGENT_PORT:-7018}"
    volumes:
      # 共享宿主机 Docker 引擎；此挂载具有宿主机级管理权限。
      - /var/run/docker.sock:/var/run/docker.sock
      # 源路径和容器内路径完全一致，保证 docker compose 的相对挂载指向宿主机。
      - ${DEPLOY_EASYHOSTAGENT_SOFTWARE_ROOT:-/software}:${DEPLOY_EASYHOSTAGENT_SOFTWARE_ROOT:-/software}
      # 复用原生 Agent 数据目录，保留身份和已配对的控制端。
      - ${DEPLOY_EASYHOSTAGENT_DATA_DIR:-/var/lib/easyhostagent}:${DEPLOY_EASYHOSTAGENT_DATA_DIR:-/var/lib/easyhostagent}
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    healthcheck:
      # 镜像内的 curl 仅用于健康检测；自签名 HTTPS 不用于鉴权或控制端调用。
      test: ["CMD-SHELL", "curl -kfsS --max-time 5 \"${EASYHOSTAGENT_TRANSPORT:-https}://127.0.0.1:${DEPLOY_EASYHOSTAGENT_PORT:-7018}/v1/health\" >/dev/null"]
      interval: 20s
      timeout: 7s
      retries: 5
      start_period: 20s
