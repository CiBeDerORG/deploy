name: flatnas

services:
  flatnas:
    image: qdnas/flatnas:latest
    container_name: flatnas
    restart: unless-stopped
    ports:
      - "${FLATNAS_BIND_IP:-0.0.0.0}:${FLATNAS_HTTP_PORT:?请在统一 .env 中配置 FLATNAS_HTTP_PORT}:3000"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      HOST: "0.0.0.0"
      PORT: "3000"
      PROXY_URL: "${FLATNAS_PROXY_URL:-}"
    volumes:
      - ../data:/app/server/data
      - ../music:/app/server/music
      - ../PC:/app/server/PC
      - ../APP:/app/server/APP
      - ../doc:/app/server/doc
