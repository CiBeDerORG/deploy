name: mihomo
services:
  mihomo:
    image: ghcr.io/metacubex/metacubexd-server:latest
    container_name: mihomo
    restart: unless-stopped
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      CONTROL_TOKEN: "${MIHOMO_CONTROL_TOKEN:?Agent token not set}"
      CLASH_SECRET: "${MIHOMO_API_SECRET:?Core API secret not set}"
      CONTROL_PORT: "8080"
      CLASH_API_PORT: "9090"
      MIXED_PORT: "7890"
      DATA_DIR: "/data"
    ports:
      - "${MIHOMO_PROXY_BIND_IP:-127.0.0.1}:${MIHOMO_MIXED_PORT:?proxy port not set}:7890/tcp"
      - "${MIHOMO_API_BIND_IP:-0.0.0.0}:${MIHOMO_API_PORT:?web port not set}:8080/tcp"
      - "${MIHOMO_CORE_API_BIND_IP:-0.0.0.0}:${MIHOMO_CORE_API_PORT:?core API port not set}:9090/tcp"
    volumes:
      - ../data/all-in-one:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/control/health"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 6
    networks:
      - default
      - proxy-net
networks:
  proxy-net:
    external: true
    name: proxy-net
